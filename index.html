<!DOCTYPE html>
<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planify — Ton mois, maîtrisé.</title>
<link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap)" rel="stylesheet">
<script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2)"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f; --surface: #13131a; --surface2: #1c1c28; --border: #2a2a3a;
    --accent: #7c5cfc; --accent2: #c084fc; --green: #22d3a0; --orange: #fb923c;
    --red: #f87171; --text: #f0f0f8; --muted: #7070a0;
  }
  html { scroll-behavior: smooth; color-scheme: dark; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg) !important; color: var(--text) !important; min-height: 100vh; overflow-x: hidden; }

/* ACCOUNT BANNER - Optional login */
.account-banner {
background: linear-gradient(135deg, rgba(124,92,252,0.1), rgba(192,132,252,0.05));
border-bottom: 1px solid rgba(124,92,252,0.2);
padding: 10px 24px;
display: flex;
align-items: center;
justify-content: space-between;
gap: 12px;
flex-wrap: wrap;
}
.account-banner p { font-size: 0.82rem; color: var(--muted); }
.account-banner p span { color: var(--accent2); }
.banner-btns { display: flex; gap: 8px; }
.btn-banner-login { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 6px 14px; font-size: 0.78rem; cursor: pointer; font-family: 'DM Sans',sans-serif; transition: all 0.2s; }
.btn-banner-login:hover { border-color: var(--accent); color: var(--accent); }
.btn-banner-signup { background: linear-gradient(135deg,var(--accent),var(--accent2)); color: #fff; border: none; border-radius: 8px; padding: 6px 14px; font-size: 0.78rem; font-weight: 700; cursor: pointer; font-family: 'DM Sans',sans-serif; transition: all 0.2s; }
.btn-banner-signup:hover { opacity: 0.85; }

/* HEADER */
header { position: sticky; top: 0; z-index: 100; background: rgba(10,10,15,0.92); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 0 24px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
.logo { font-family: 'Syne',sans-serif; font-weight: 800; font-size: 1.4rem; background: linear-gradient(135deg,#fff 30%,var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.logo span { -webkit-text-fill-color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 10px; }
.plan-chip { font-size: 0.7rem; font-weight: 700; padding: 5px 12px; border-radius: 20px; }
.plan-chip.free { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
.plan-chip.pro { background: linear-gradient(135deg,var(--accent),var(--accent2)); color: #fff; }
.user-chip { display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px; font-size: 0.78rem; color: var(--muted); }
.user-avatar { width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg,var(--accent),var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 800; color: #fff; }
.btn-upgrade-header { background: linear-gradient(135deg,var(--accent),var(--accent2)); color: #fff; border: none; border-radius: 10px; padding: 8px 14px; font-family: 'DM Sans',sans-serif; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: all 0.2s; }
.btn-upgrade-header:hover { opacity: 0.85; }
.btn-logout { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 6px 10px; font-size: 0.75rem; cursor: pointer; font-family: 'DM Sans',sans-serif; transition: all 0.2s; }
.btn-logout:hover { border-color: var(--red); color: var(--red); }
.saving-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: blink 1.5s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* MAIN */
main { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 40px 24px 80px; }
.hero { text-align: center; margin-bottom: 48px; animation: fadeUp 0.6s ease both; }
.hero h1 { font-family: 'Syne',sans-serif; font-size: clamp(1.8rem,5vw,3.2rem); font-weight: 800; line-height: 1.1; margin-bottom: 12px; background: linear-gradient(160deg,#fff 40%,var(--muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.hero p { color: var(--muted); font-size: 1rem; font-weight: 300; }

.setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; animation: fadeUp 0.6s 0.1s ease both; }
@media(max-width:640px){ .setup-grid { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 28px; transition: border-color 0.2s, transform 0.2s; }
.card:hover { border-color: rgba(124,92,252,0.3); transform: translateY(-2px); }
.card-label { font-family: 'Syne',sans-serif; font-size: 0.75rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.card-label .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.card h2 { font-family: 'Syne',sans-serif; font-size: 1.15rem; font-weight: 700; margin-bottom: 20px; }
label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
input, select { width: 100%; background: var(--surface2) !important; border: 1px solid var(--border); border-radius: 12px; color: var(--text) !important; font-family: 'DM Sans',sans-serif; font-size: 0.95rem; padding: 12px 16px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; margin-bottom: 16px; color-scheme: dark; }
input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,92,252,0.15); }
input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

.btn { display: inline-flex; align-items: center; gap: 8px; border: none; border-radius: 12px; font-family: 'DM Sans',sans-serif; font-size: 0.92rem; font-weight: 600; cursor: pointer; transition: all 0.2s; padding: 12px 20px; }
.btn-primary { background: linear-gradient(135deg,var(--accent),var(--accent2)); color: #fff; width: 100%; justify-content: center; padding: 14px; font-size: 1rem; }
.btn-primary:hover { opacity: 0.88; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(124,92,252,0.35); }
.btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn-danger { background: rgba(248,113,113,0.1); color: var(--red); border: 1px solid rgba(248,113,113,0.2); padding: 6px 12px; font-size: 0.8rem; border-radius: 8px; }
.btn-sm { padding: 8px 14px; font-size: 0.82rem; }

.stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 32px; animation: fadeUp 0.6s 0.2s ease both; }
@media(max-width:900px){ .stats-grid { grid-template-columns: repeat(2,1fr); } }
@media(max-width:480px){ .stats-grid { grid-template-columns: 1fr; } }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 24px; position: relative; overflow: hidden; transition: transform 0.2s; }
.stat-card:hover { transform: translateY(-3px); }
.stat-card::before { content: ''; position: absolute; top: -30px; right: -30px; width: 80px; height: 80px; border-radius: 50%; opacity: 0.1; background: var(--stat-color,var(--accent)); }
.stat-icon { font-size: 1.4rem; margin-bottom: 12px; display: block; }
.stat-value { font-family: 'Syne',sans-serif; font-size: 1.9rem; font-weight: 800; color: var(--stat-color,var(--text)); line-height: 1; margin-bottom: 4px; }
.stat-label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

.progress-section { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 28px; margin-bottom: 32px; animation: fadeUp 0.6s 0.3s ease both; }
.progress-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; }
.progress-title { font-family: 'Syne',sans-serif; font-weight: 700; font-size: 1.05rem; }
.progress-pct { font-family: 'Syne',sans-serif; font-weight: 800; font-size: 1.5rem; color: var(--accent2); }
.progress-bar-wrap { background: var(--surface2); border-radius: 100px; height: 12px; overflow: hidden; margin-bottom: 12px; }
.progress-bar-fill { height: 100%; border-radius: 100px; background: linear-gradient(90deg,var(--accent),var(--accent2)); transition: width 1s cubic-bezier(0.4,0,0.2,1); position: relative; }
.progress-bar-fill::after { content: ''; position: absolute; top:0;right:0;bottom:0; width: 30px; background: linear-gradient(90deg,transparent,rgba(255,255,255,0.3)); animation: shimmer 2s infinite; }
@keyframes shimmer { 0%,100%{opacity:0} 50%{opacity:1} }
.progress-meta { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); }

.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
.section-title { font-family: 'Syne',sans-serif; font-weight: 700; font-size: 1.2rem; }
.week-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 8px; margin-bottom: 24px; }
@media(max-width:700px){ .week-grid { grid-template-columns: repeat(4,1fr); } }
@media(max-width:400px){ .week-grid { grid-template-columns: repeat(3,1fr); } }
.day-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 10px; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; user-select: none; }
.day-card:hover { border-color: var(--accent); }
.day-card.worked { background: rgba(124,92,252,0.12); border-color: var(--accent); }
.day-card.today { border-color: var(--green); box-shadow: 0 0 12px rgba(34,211,160,0.2); }
.day-card.past { opacity: 0.5; }
.day-card.weekend { border-color: rgba(251,146,60,0.3); }
.day-card.weekend.worked { background: rgba(251,146,60,0.1); border-color: var(--orange); }
.day-name { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 6px; }
.day-num { font-family: 'Syne',sans-serif; font-size: 1.1rem; font-weight: 700; }
.day-check { position: absolute; top: 6px; right: 6px; width: 14px; height: 14px; background: var(--accent); border-radius: 50%; display: none; align-items: center; justify-content: center; }
.day-card.worked .day-check { display: flex; }
.day-check::after { content: '✓'; color: #fff; font-size: 8px; font-weight: 900; }

.shift-section { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 28px; margin-bottom: 32px; }
.shift-list { display: flex; flex-direction: column; gap: 10px; }
.shift-item { display: flex; align-items: center; justify-content: space-between; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; gap: 12px; flex-wrap: wrap; }
.shift-date { font-family: 'Syne',sans-serif; font-weight: 700; font-size: 0.95rem; min-width: 100px; }
.shift-hours { color: var(--muted); font-size: 0.85rem; flex: 1; }
.shift-earn { font-family: 'Syne',sans-serif; font-weight: 700; color: var(--green); font-size: 0.95rem; }
.empty-state { text-align: center; padding: 40px; color: var(--muted); font-size: 0.9rem; }
.empty-state .emoji { font-size: 2.5rem; margin-bottom: 12px; display: block; }

/* PRO LOCK */
.pro-wrapper { position: relative; margin-bottom: 32px; border-radius: 20px; }
.pro-blur { filter: blur(5px); pointer-events: none; user-select: none; opacity: 0.5; border-radius: 20px; overflow: hidden; }
.pro-lock-overlay { position: absolute; inset: 0; z-index: 10; background: rgba(10,10,15,0.55); backdrop-filter: blur(1px); border-radius: 20px; border: 1px solid rgba(124,92,252,0.4); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; cursor: pointer; padding: 32px; text-align: center; }
.pro-lock-overlay:hover { background: rgba(10,10,15,0.7); }
.lock-icon { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg,var(--accent),var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: 0 4px 24px rgba(124,92,252,0.5); animation: lockPulse 2.5s ease-in-out infinite; }
@keyframes lockPulse { 0%,100%{box-shadow:0 4px 20px rgba(124,92,252,0.4)} 50%{box-shadow:0 4px 40px rgba(124,92,252,0.8)} }
.lock-title { font-family: 'Syne',sans-serif; font-weight: 800; font-size: 1.05rem; background: linear-gradient(135deg,#fff,var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.lock-desc { font-size: 0.83rem; color: var(--muted); max-width: 260px; line-height: 1.5; }
.lock-btn { background: linear-gradient(135deg,var(--accent),var(--accent2)); color: #fff; border: none; border-radius: 12px; padding: 11px 26px; font-family: 'Syne',sans-serif; font-size: 0.87rem; font-weight: 700; cursor: pointer; transition: all 0.2s; }
.lock-btn:hover { transform: translateY(-2px); }
.pro-badge { display: inline-flex; align-items: center; background: linear-gradient(135deg,var(--accent),var(--accent2)); color: #fff; font-size: 0.58rem; font-weight: 800; letter-spacing: 1px; padding: 2px 7px; border-radius: 6px; text-transform: uppercase; vertical-align: middle; margin-left: 6px; }

.feat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 28px; }
.proj-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-top: 20px; }
@media(max-width:600px){ .proj-row { grid-template-columns: 1fr; } }
.proj-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 14px; padding: 18px; text-align: center; }
.proj-val { font-family: 'Syne',sans-serif; font-size: 1.5rem; font-weight: 800; margin-bottom: 4px; }
.proj-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }

input[type=range] { -webkit-appearance: none; width: 100%; height: 6px; border-radius: 100px; outline: none; cursor: pointer; padding: 0; margin-bottom: 0; border: none !important; background: linear-gradient(90deg,var(--accent) var(--range-pct,0%),var(--surface2) var(--range-pct,0%)) !important; color-scheme: dark; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: white; cursor: pointer; border: 3px solid var(--accent2); }
.slider-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.slider-val { font-family: 'Syne',sans-serif; font-size: 1.4rem; font-weight: 800; color: var(--accent2); }
.sim-result { margin-top: 20px; background: var(--surface2); border: 1px solid var(--border); border-radius: 14px; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.sim-item-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
.sim-item-val { font-family: 'Syne',sans-serif; font-size: 1
